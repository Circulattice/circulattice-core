# SPDX-License-Identifier: Apache-2.0
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check style, types and behavior
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          python -m unittest discover -s tests -v
          python -m benchmarks.compare
      - name: Build and smoke-test the distribution
        run: |
          python -m build --no-isolation
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          circulattice solve "$GITHUB_WORKSPACE/examples/cycle.json" > plan.json
          circulattice check "$GITHUB_WORKSPACE/examples/cycle.json" plan.json
